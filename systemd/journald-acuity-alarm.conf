# Drop-in for /etc/systemd/journald.conf.d/acuity-alarm.conf. Whichever
# services actually run on this box (e.g. haircut-dashboard.service) log to
# journald only -- no file-based logging is configured anywhere in this
# repo's deployment -- so without an explicit cap, journald's default
# allows persistent logs to grow to a meaningful fraction of the
# filesystem, which matters on a small Always Free boot volume. This bounds
# it outright, independent of disk size.
#
# Applies system-wide (journald doesn't support a per-unit disk quota), so
# it's a one-time install regardless of which units are running.

[Journal]
SystemMaxUse=200M
RuntimeMaxUse=50M
MaxRetentionSec=30day
