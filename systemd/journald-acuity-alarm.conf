# Drop-in for /etc/systemd/journald.conf.d/acuity-alarm.conf. Both
# acuity-alarm.service and heartbeat-check.service log to journald only (no
# file-based logging is configured anywhere in this deployment) -- without
# an explicit cap, journald's default allows persistent logs to grow to a
# meaningful fraction of the filesystem, which matters on a small Always
# Free boot volume. This bounds it outright, independent of disk size.
#
# Applies system-wide (this is the only service on the box), not just to
# these two units -- journald doesn't support a per-unit disk quota.

[Journal]
SystemMaxUse=200M
RuntimeMaxUse=50M
MaxRetentionSec=30day
