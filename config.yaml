# Secrets (Telegram token, SMTP password, etc.) go in .env / environment
# variables (or GitHub repo secrets for the Actions workflow), never here.

# No seed dates -- add/remove them via the dashboard instead (they persist
# in state.json, not here). See infra discussion for how that differs from
# seeding dates in this file.
target_dates: []

# Default filter for any target_dates entry that doesn't set its own
# time_window override above. Empty = any time.
time_window: {}

timezone: America/Los_Angeles

acuity:
  owner: "dc1e29cb"
  appointment_type_id: "82222707"
  calendar_id: "any"

booking_url: "https://esharphair.as.me/schedule/dc1e29cb/appointment/82222707"
business_name: "E sharp hair"

# Initial guess only, used to seed the polling cadence before any date has
# been observed to actually open. Once the monitor sees a real false->true
# flip for a target date, it stores the measured value in state.json and
# stops relying on this estimate.
booking_window_months_estimate: 2

poll:
  far_hours: 6        # more than 3 days before the estimated open date
  near_minutes: 30     # within 3 days of the estimated open date
  hot_minutes: 5        # on the estimated open date and the following 24h
  found_hours: 2        # after a slot has been found and alerted
  min_minutes: 2         # hard floor -- never poll faster than this

channels:
  telegram: true
  email: false   # no SMTP_* configured -- Telegram only

alert_on_removal: false   # also alert when a previously-seen slot disappears
heartbeat: false            # daily "still watching" message
alert_rate_limit_seconds: 600  # max 1 alert per channel per 10 minutes

dry_run: false   # false = actually send once channel secrets are configured

state_file: "state.json"
log_file: "monitor.log"
